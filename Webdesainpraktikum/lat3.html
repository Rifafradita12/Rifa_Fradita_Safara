<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan Table</title>
</head>
<body>
    <table border="1" cellpadding="5" cellspacing="5" width="50%">
        <caption>Daftar Belanja</caption>
        <thead>
         <tr bgcolor="gred">
            <th >No</th>
            <td>Nama Barang</td>
            <td>Unit</td>
            <th>Barang</th>
        </tr>
        </thead>

        <tbody>

         <tr>
            <td>1</td>
            <td>Pasta Gigi</td>
            <td>1</td>
            <td>Rp. 7000</td>
        </tr>

         <tr>
            <td>2</td>
            <td>Shampo</td>
            <td>2</td>
            <td>Rp. 7000</td>
        </tr>

        </tbody>


        <tfoot bgcolor="yellow">
            <tr>
                <td colspan="3">Total Harga</td>
                <td>Rp. 20.000</td>
            </tr>
        </tfoot>

    </table>
</body>
</html>
