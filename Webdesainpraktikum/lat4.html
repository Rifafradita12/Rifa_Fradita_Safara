<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan form</title>
</head>
<body>
    <h2>formulir</h2>
    <hr>
    <br>
    <form action="">
        <label>masukan nama anda</label>
        <input type="text" name="nama" placeholder="isi nama anda" size="25" maxlength="50">

        <br><br>
        <label>Masukkan Password</label>
        <input type="password" name="pass">
        <br><br>

        <label>masukkan email anda</label>
        <input type="email" name="emailku" placeholder="nama@gmail.com">
        <br><br>

        <label>masukkan warna favorit</label>
        <input type="color" name="favcolor">
        <br><br>

        <label>masukan tanggal lahir</label>
        <input type="date" name="tgl_lahir">
        <br><br>

        <label>input nilai</label>
        <input type="number" name="nilai" min="0"
        max="10">
        <br><br>

        <label>pilih minggu</label>
        <input type="week" name="minggu">
        <br><br>

        <label>pilih bulan</label>
        <input type="month" name="januari">
        <br><br>

     <label>upload foto</label>
        <input type="file" name="foto">
        <br><br>

                      <label>pilih hobi</label>
                      <br>
        <input type="checkbox" name="hobi" value="futsal">futsal
                     <label>pilih hobi</label>
                     <br>
        <input type="checkbox" name="hobi" value="badminton">badminton
                      <label>pilih hobi</label>
                      <br>
        <input type="checkbox" name="hobi" value="renang">renang
                      <label>pilih hobi</label>
                      <br>
        <input type="checkbox" name="hobi" value="basket">basket
        <br><br>

             <label>jenis Kelamin</label>
        <input type="radio" name="jk" value="L">LAKI LAKI
        <br><br>
         <label>jenis Kelamin</label>
        <input type="radio" name="jk" value="P">PEREMPUAN
        <br><br>


         <label>PRODI STTNF</label>
  <select name="prodi">
    <option value="">pilih prodi</option>
    <option value="si">SI</option>
    <option value="TI">TI</option>
    <option value="bd">bd</option>
    <option value="cs">cs</option>
  </select>
  <br><br>

   <label>kolom komentar</label>
        <textarea name="komentar" cols="25" rows="5"></textarea>
        <br><br>

        <input type="submit" name="proses" value="simpan">
         <input type="reset" name="unproses" value="batal">
</body>
</html>
